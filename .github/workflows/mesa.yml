name: mesa
# Mesa (freedreno + softpipe) for iOS, against the SweetGPU kernel service: tools/mk-mesa.sh.
# Userland only; it does not wait for a kernel build.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner
        default: macos-15
      drivers:
        description: gallium drivers
        default: softpipe,freedreno
  push:
    branches: [ginkgo-sd]
    paths:
      - "tools/mesa/**"
      - "tools/mk-mesa.sh"
      - "tools/eagl/**"
      - ".github/workflows/mesa.yml"
jobs:
  mesa:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          brew install ninja bison flex
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" -q install meson mako pyyaml packaging
          echo "$RUNNER_TEMP/venv/bin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
      - name: build
        run: DRIVERS='${{ inputs.drivers || 'softpipe,freedreno' }}' OUT=$PWD/mesa-out BUILD_DIR=$RUNNER_TEMP/mesa tools/mk-mesa.sh
      - name: eagl (libsweet-gl.dylib, eagl_test)
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          CC="$(xcrun -sdk iphoneos -f clang) -arch arm64 -isysroot $SDK -miphoneos-version-min=16.0 -O2"
          mkdir -p obj
          python3 tools/eagl/mkeagl.py tools/eagl/eagl_slots.txt mesa-out/gl.xml mesa-out/exported-gl.txt tools/eagl/eagl.c > obj/eagl_gen.h
          $CC -dynamiclib -install_name /var/sweet/lib/libsweet-gl.dylib -Iobj -Itools/eagl -framework CoreFoundation \
            -framework IOKit -framework IOSurface -lobjc mesa-out/libOSMesa.8.dylib -o mesa-out/libsweet-gl.dylib \
            tools/eagl/eagl.c tools/eagl/gl_osmesa.c
          $CC -framework OpenGLES -lobjc -o mesa-out/eagl_test tools/eagl/eagl_test.c
          codesign -f -s - mesa-out/libsweet-gl.dylib mesa-out/eagl_test
          otool -L mesa-out/libsweet-gl.dylib | head -5
      - name: logs on failure
        if: failure()
        run: |
          for f in $RUNNER_TEMP/mesa/build-*/meson-logs/meson-log.txt; do tail -n 80 "$f"; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: mesa-ios-arm64
          path: mesa-out/
